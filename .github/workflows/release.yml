name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "Formula/**"
      - "bucket/**"

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: deskbridge-macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: deskbridge-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: deskbridge-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: deskbridge-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set version
        shell: bash
        run: |
          echo "DESKBRIDGE_VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "DESKBRIDGE_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: cargo build --release --locked -p deskbridge --target ${{ matrix.target }}
      - name: Sign and notarize
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: build/ci-sign-macos.sh "target/${{ matrix.target }}/release/deskbridge"
      - name: Collect binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/deskbridge"
          if [ "${{ runner.os }}" = "Windows" ]; then
            src="${src}.exe"
          fi
          cp "$src" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.0.${{ github.run_number }}
        run: |
          short="${GITHUB_SHA::7}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG ($short)" \
              --notes "Commit ${short}."
          fi
      - name: Update Homebrew and Scoop manifests
        env:
          TAG: v0.0.${{ github.run_number }}
          VERSION: 0.0.${{ github.run_number }}
        run: |
          python3 packaging/update-manifests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/deskbridge.rb bucket/deskbridge.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "update package manifests to ${TAG}"
          git pull --rebase origin main
          git push
