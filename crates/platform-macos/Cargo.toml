[package]
name = "deskbridge-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
apple-cf = "0.11"
deskbridge-proto = { path = "../proto" }
deskbridge-session = { path = "../session" }
screencapturekit = "11"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
videotoolbox = { version = "0.21", features = ["compression"] }
winit = "0.30"
